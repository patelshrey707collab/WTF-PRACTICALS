<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinSecure - Security Demonstration Portal</title>
    <link rel="stylesheet" href="style10.css">
</head>
<body>

    <div class="form-container">
        <h2>Secure Portal</h2>
        
        <!-- Status alert box -->
        <div id="alertBox" class="alert alert-error" style="display: none;"></div>

        <!-- Registration / User Input Form -->
        <form id="secureForm" action="/register" method="POST">
            <div class="form-group">
                <label for="username">Username / Email</label>
                <input type="text" id="username" name="username" required placeholder="Enter username">
            </div>

            <div class="form-group">
                <label for="password">Password (Min 8 Characters)</label>
                <!-- Enforcing password policy attributes -->
                <input type="password" id="password" name="password" required minlength="8" placeholder="Enter secure password">
            </div>

            <button type="submit" class="btn-submit">Register Securely</button>
        </form>

        <hr style="border: 0; border-top: 1px solid #475569; margin: 1.5rem 0;">

        <!-- Comment / XSS Testing Section -->
        <form id="commentForm" action="/comment" method="POST">
            <div class="form-group">
                <label for="comment">Leave a Comment (Sanitized Input)</label>
                <input type="text" id="comment" name="comment" required placeholder="Type a comment...">
            </div>
            <button type="submit" class="btn-submit" style="background-color: #059669;">Post Comment</button>
        </form>
    </div>

    <script>
        // Optional client-side enhancement for password confirmation or feedback
        document.getElementById('secureForm').addEventListener('submit', function(e) {
            const password = document.getElementById('password').value;
            if (password.length < 8) {
                e.preventDefault();
                alert('Password must be at least 8 characters long!');
            }
        });
    </script>
</body>
</html>
